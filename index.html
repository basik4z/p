<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTELLIGENCE OSINT SYSTEM v4.5</title>
    <style>
        :root {
            --bg-color: #050b14;
            --card-bg: #0c1524;
            --primary: #0055ff;
            --primary-glow: #00c3ff;
            --text: #ffffff;
            --text-muted: #7085a0;
            --success: #00e676;
            --border: #14253d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Courier New', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 85, 255, 0.15);
            position: relative;
        }

        .container::before {
            content: 'TARGET SEARCH SYSTEM v4.5';
            position: absolute;
            top: -12px;
            left: 20px;
            background: var(--bg-color);
            padding: 0 10px;
            font-size: 11px;
            color: var(--primary-glow);
            letter-spacing: 2px;
            font-weight: bold;
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 195, 255, 0.5);
        }

        /* Вкладки / Табы */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(12, 21, 36, 0.8);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            border-color: var(--primary-glow);
            color: #fff;
            background: rgba(0, 85, 255, 0.1);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary-glow);
            box-shadow: 0 0 15px rgba(0, 85, 255, 0.4);
        }

        /* Поля ввода */
        .input-group {
            display: none;
            margin-bottom: 20px;
            animation: fadeIn 0.4s ease forwards;
        }

        .input-group.active {
            display: block;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #060d1a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-glow);
            box-shadow: 0 0 10px rgba(0, 195, 255, 0.2);
        }

        /* Кнопки */
        .action-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, var(--primary), #0033aa);
            border: 1px solid var(--primary-glow);
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .action-btn:hover {
            box-shadow: 0 0 20px rgba(0, 195, 255, 0.6);
            transform: translateY(-1px);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* Радар и Прогресс */
        .radar-box {
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 25px 0;
            animation: fadeIn 0.4s ease;
        }

        .circle-progress {
            width: 130px;
            height: 130px;
            position: relative;
            transform: rotate(-90deg);
        }

        .circle-progress svg {
            width: 130px;
            height: 130px;
        }

        .circle-bg {
            fill: none;
            stroke: #071224;
            stroke-width: 8;
        }

        .circle-bar {
            fill: none;
            stroke: var(--primary-glow);
            stroke-width: 8;
            stroke-dasharray: 377;
            stroke-dashoffset: 377;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .percentage-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        /* Терминал */
        .terminal {
            display: none;
            background: #03070f;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #a0b0c5;
            margin-bottom: 25px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .terminal::-webkit-scrollbar {
            width: 5px;
        }
        .terminal::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .log-line {
            margin-bottom: 6px;
            white-space: nowrap;
        }
        .log-success { color: var(--success); }
        .log-warning { color: #ff5555; }

        /* Вывод досье */
        .dossier-card {
            display: none;
            background: #091321;
            border-left: 4px solid var(--primary-glow);
            border-radius: 4px;
            padding: 20px;
            animation: slideUp 0.5s ease forwards;
            margin-bottom: 20px;
        }

        .dossier-title {
            font-size: 15px;
            color: var(--primary-glow);
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: #fff;
            font-weight: 500;
            text-align: right;
            max-width: 60%;
        }

        .badge {
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        /* Кнопка экспорта */
        .export-btn {
            display: none;
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--success);
            color: var(--success);
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.1);
            animation: fadeIn 0.5s ease;
        }

        .export-btn:hover {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
        }

        /* Анимации */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Глобальный Поиск и Анализ Утечек</h2>

    <!-- Вкладки видов поиска -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('phone')">📱 По номеру</button>
        <button class="tab-btn" onclick="switchTab('email')">📧 По Email</button>
        <button class="tab-btn" onclick="switchTab('fio')">👤 По ФИО</button>
    </div>

    <!-- Контент вкладок -->
    <div id="phone-group" class="input-group active">
        <label for="phone-input">Введите Номер Телефона:</label>
        <input type="text" id="phone-input" placeholder="+7 (999) 000-00-00">
    </div>

    <div id="email-group" class="input-group">
        <label for="email-input">Введите Email Адрес:</label>
        <input type="email" id="email-input" placeholder="example@mail.com">
    </div>

    <div id="fio-group" class="input-group">
        <label for="fio-input">Введите Полное ФИО человека:</label>
        <input type="text" id="fio-input" placeholder="Иванов Иван Иванович">
    </div>
